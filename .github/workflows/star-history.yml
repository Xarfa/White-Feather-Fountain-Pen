name: star-history

on:
  schedule:
    - cron: "23 3 * * 1" # weekly, Monday 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw star history chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: python .github/scripts/star_chart.py
      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: update star history chart"
          git push
